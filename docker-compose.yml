name: agendamento-consultas

services:
  banco:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${BANCO_USUARIO:?copie .env.example para .env}
      POSTGRES_PASSWORD: ${BANCO_SENHA:?copie .env.example para .env}
      POSTGRES_DB: ${BANCO_NOME:?copie .env.example para .env}
    ports:
      - '${PORTA_BANCO:-5433}:5432'
    volumes:
      - dados-banco:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      API_PORTA: '3000'
      ORIGEM_FRONTEND: http://localhost:${PORTA_WEB:-5173}
      BANCO_HOST: banco
      BANCO_PORTA: '5432'
      BANCO_USUARIO: ${BANCO_USUARIO}
      BANCO_SENHA: ${BANCO_SENHA}
      BANCO_NOME: ${BANCO_NOME}
    ports:
      - '${PORTA_API:-3000}:3000'
    depends_on:
      banco:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${PORTA_API:-3000}
    ports:
      - '${PORTA_WEB:-5173}:80'
    depends_on:
      - api

volumes:
  dados-banco:
